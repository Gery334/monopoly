<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOGUL — Playable Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Limelight&family=Josefin+Sans:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{
  --void:#08060D;
  --slab:#15111D;
  --tile:#1E1828;
  --tile-hi:#272037;
  --brass:#C8A45C;
  --brass-dim:#6B5A2E;
  --gold:#F0D98C;
  --bone:#EDE6D6;
  --bone-dim:#8C8375;
  --cyan:#4FE3D7;
  --p0:#6FE0FF; --p1:#FF7A9C; --p2:#9C7BFF; --p3:#7CE0A0;
  --d1:#C0703C; --d2:#CFC4A8; --d3:#4EA88A; --d4:#B54A63; --d5:#DDB44A; --d6:#8FA3B8;
  --cell:78px;
  --tilt:50deg;
  --unsquash:1.556;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--void);
  color:var(--bone);
  font-family:'Josefin Sans',system-ui,sans-serif;
  font-weight:300;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
.deco{font-family:'Limelight',serif;font-weight:400}

/* ---------- SHELL ---------- */
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
header{
  display:flex;align-items:center;gap:22px;
  padding:10px 20px;
  border-bottom:1px solid var(--brass-dim);
  background:linear-gradient(180deg,#100C18,#0A0710);
  flex:0 0 auto;z-index:20;
}
.wordmark{font-family:'Limelight',serif;font-size:22px;letter-spacing:.22em;color:var(--gold);white-space:nowrap}
.wordmark span{color:var(--bone-dim);font-size:9px;letter-spacing:.3em;display:block;margin-top:2px;font-family:'Josefin Sans'}

.phasebar{display:flex;gap:2px;flex:1;max-width:520px}
.ph{
  flex:1;padding:5px 8px;text-align:center;font-size:9px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--bone-dim);border-bottom:2px solid #2A2233;transition:.5s;
}
.ph.on{color:var(--gold);border-bottom-color:var(--gold)}
.ph.done{color:#5A5265;border-bottom-color:var(--brass-dim)}
.ph b{display:block;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:400;margin-top:2px}

.hdr-stat{text-align:right;line-height:1.15}
.hdr-stat .k{font-size:8px;letter-spacing:.24em;color:var(--bone-dim);text-transform:uppercase}
.hdr-stat .v{font-family:'JetBrains Mono',monospace;font-size:16px;color:var(--bone)}

main{flex:1;display:grid;grid-template-columns:210px 1fr 250px;min-height:0}
aside{overflow-y:auto;padding:12px;scrollbar-width:thin;scrollbar-color:var(--brass-dim) transparent}
#left{border-right:1px solid #221C2E}
#right{border-left:1px solid #221C2E;display:flex;flex-direction:column;gap:10px}

/* ---------- LEDGER CARDS ---------- */
.card{
  position:relative;border:1px solid #2C2438;background:linear-gradient(160deg,#1A1524,#120E1B);
  padding:9px 10px;margin-bottom:8px;transition:.35s;
}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--pc)}
.card.active{border-color:var(--pc);box-shadow:0 0 0 1px var(--pc),0 0 26px -6px var(--pc);transform:translateX(3px)}
.card.dead{opacity:.4;filter:grayscale(1)}
.card .nm{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--pc);font-weight:600}
.card .tag{font-size:8px;letter-spacing:.2em;color:var(--d4);text-transform:uppercase;margin-top:1px}
.card .cash{font-family:'JetBrains Mono',monospace;font-size:19px;margin:3px 0 1px}
.card .sub{font-size:10px;color:var(--bone-dim);letter-spacing:.08em}
.card .augs{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.pip{
  font-size:8px;letter-spacing:.08em;text-transform:uppercase;padding:2px 5px;
  border:1px solid;border-radius:1px;white-space:nowrap;cursor:help;
}
.pip.s{color:#C7CEDA;border-color:#5B6472;background:#5b647222}
.pip.g{color:var(--gold);border-color:var(--brass);background:#c8a45c22}
.pip.p{color:#E7A6FF;border-color:#A45CD6;background:#a45cd633;box-shadow:0 0 8px -2px #A45CD6}
.flash{animation:flash .5s}
@keyframes flash{0%{background:#F0D98C55}100%{background:transparent}}

/* ---------- STAGE ---------- */
#stage{position:relative;display:flex;flex-direction:column;min-width:0;overflow:hidden}
#sky{position:absolute;inset:0;overflow:hidden}
.skylayer{position:absolute;inset:-10%;opacity:0;transition:opacity 2.2s ease}
.skylayer.on{opacity:1}
#sky0{background:radial-gradient(ellipse at 50% 30%,#1B2C4A 0%,#0B0C18 55%,#06050B 100%)}
#sky1{background:radial-gradient(ellipse at 50% 26%,#3A2E1E 0%,#140F16 55%,#07050C 100%)}
#sky2{background:radial-gradient(ellipse at 50% 34%,#4A2416 0%,#170D1B 55%,#07050C 100%)}
#sky3{background:radial-gradient(ellipse at 50% 40%,#141C36 0%,#0A0714 50%,#040309 100%)}
.rain{position:absolute;inset:0;opacity:0;transition:opacity 2s;pointer-events:none;
  background-image:repeating-linear-gradient(74deg,transparent 0 5px,rgba(160,200,255,.22) 5px 6px,transparent 6px 26px);
  background-size:240px 240px;animation:rain 1.1s linear infinite}
.rain.on{opacity:.5}
@keyframes rain{to{background-position:-160px 480px}}

#boardwrap{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0}
#persp{perspective:3000px;perspective-origin:50% 46%}
#plane{
  width:calc(var(--cell)*7);height:calc(var(--cell)*7);
  position:relative;transform-style:preserve-3d;
  transform:rotateX(var(--tilt)) translateY(-4%);
  transition:transform 1.4s cubic-bezier(.2,.7,.2,1);
}
#plane::after{ /* slab edge glow */
  content:'';position:absolute;inset:-14px;border:1px solid var(--brass-dim);
  background:linear-gradient(140deg,#191320,#0E0B14);z-index:-1;
  box-shadow:0 0 90px -10px rgba(200,164,92,.35),inset 0 0 60px rgba(0,0,0,.9);
}

.tile{
  position:absolute;width:var(--cell);height:var(--cell);
  background:var(--tile);border:1px solid #2A2336;transform-style:preserve-3d;
  transition:background .4s,border-color .4s;
}
.tile.corner{background:#191322;border-color:var(--brass-dim)}
.tile .lbl{
  position:absolute;left:3px;right:3px;bottom:4px;text-align:center;
  transform:scaleY(var(--unsquash));transform-origin:bottom center;
  font-size:7.5px;letter-spacing:.09em;text-transform:uppercase;line-height:1.15;
  color:var(--bone-dim);pointer-events:none;
}
.tile .price{display:block;font-family:'JetBrains Mono',monospace;font-size:7px;color:var(--brass);letter-spacing:0}
.tile .band{position:absolute;top:0;left:0;right:0;height:5px;background:var(--dc);opacity:.85}
.tile.owned{background:var(--tile-hi)}
.tile.mort{filter:grayscale(1) brightness(.55)}
.tile.hot{box-shadow:inset 0 0 0 1px var(--gold)}
.tile.sel{box-shadow:inset 0 0 0 2px var(--gold)}
.tile.clickable{cursor:pointer}
.tile.clickable:hover{background:#302743}
.ownglow{position:absolute;inset:0;background:var(--oc);opacity:.14;transition:.5s}

/* buildings: stacked deco setback slices */
.bldg{position:absolute;left:50%;top:50%;transform-style:preserve-3d;pointer-events:none}
.slice{
  position:absolute;left:50%;top:50%;border-radius:1px;
  background:var(--sc);
  box-shadow:0 0 0 .5px rgba(0,0,0,.55);
}
.holo .slice{background:transparent;border:1px dashed rgba(79,227,215,.55);box-shadow:none}
.holo{animation:holo 3.4s ease-in-out infinite}
@keyframes holo{0%,100%{opacity:.5}50%{opacity:.95}}
.crown{position:absolute;left:50%;top:50%;background:var(--gold);box-shadow:0 0 14px 2px var(--gold)}

/* tokens */
.tok{position:absolute;width:16px;height:16px;transform-style:preserve-3d;pointer-events:none;
  transition:left .28s cubic-bezier(.3,1.5,.5,1),top .28s cubic-bezier(.3,1.5,.5,1)}
.tok i{position:absolute;inset:2px;background:var(--pc);transform:translateZ(11px) rotate(45deg);
  box-shadow:0 0 14px 3px var(--pc);border:1px solid #fff9}
.tok u{position:absolute;inset:-3px;border:1px solid var(--pc);border-radius:50%;opacity:.55;
  box-shadow:0 0 10px -2px var(--pc)}
.tok.me i{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateZ(11px) rotate(45deg)}50%{transform:translateZ(19px) rotate(135deg)}}

/* center medallion */
#core{
  position:absolute;left:var(--cell);top:var(--cell);
  width:calc(var(--cell)*5);height:calc(var(--cell)*5);
  background:
    repeating-conic-gradient(from 0deg at 50% 50%, #171120 0deg 7.5deg, #120D1A 7.5deg 15deg),
    #120D1A;
  border:1px solid var(--brass-dim);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
}
#core .inner{transform:scaleY(var(--unsquash));text-align:center}
#phname{font-family:'Limelight',serif;font-size:26px;letter-spacing:.16em;color:var(--gold);
  text-shadow:0 0 24px rgba(240,217,140,.5)}
#phsub{font-size:9px;letter-spacing:.28em;color:var(--bone-dim);text-transform:uppercase;margin-top:2px}
#dice{display:flex;gap:9px;justify-content:center;margin-top:10px}
.die{width:34px;height:34px;background:linear-gradient(150deg,#F3ECDD,#C9BFA8);color:#171120;
  font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:700;
  display:flex;align-items:center;justify-content:center;border-radius:3px;
  box-shadow:0 0 18px -4px #F3ECDD}
.die.rolling{animation:tumble .42s linear infinite}
@keyframes tumble{0%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(1.18)}100%{transform:rotate(360deg) scale(1)}}
#mult{margin-top:8px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--d4);letter-spacing:.1em}

/* ---------- ACTION BAR ---------- */
#bar{
  flex:0 0 auto;position:relative;z-index:10;
  border-top:1px solid var(--brass-dim);background:linear-gradient(0deg,#0C0912,#140F1C);
  padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:62px;
}
#prompt{flex:1;font-size:13px;letter-spacing:.05em;color:var(--bone);min-width:180px}
#prompt b{color:var(--gold);font-weight:600}
.btn{
  padding:9px 18px;border:1px solid var(--brass);color:var(--gold);
  font-size:11px;letter-spacing:.2em;text-transform:uppercase;transition:.18s;
  background:linear-gradient(180deg,#241B14,#160F0C);white-space:nowrap;
}
.btn:hover:not(:disabled){background:var(--gold);color:#100C08;box-shadow:0 0 22px -4px var(--gold)}
.btn:disabled{opacity:.28;cursor:default}
.btn.ghost{border-color:#4A4157;color:var(--bone-dim);background:transparent}
.btn.ghost:hover:not(:disabled){border-color:var(--bone);color:var(--bone);background:#ffffff10;box-shadow:none}
.btn.big{padding:11px 30px;font-size:13px}
.btn.danger{border-color:#B54A63;color:#FF95AC;background:linear-gradient(180deg,#2A1219,#170B0F)}
.btn.danger:hover:not(:disabled){background:#B54A63;color:#fff}

/* ---------- LOG / SIDE ---------- */
.panel{border:1px solid #2C2438;background:#120E1B;padding:9px 10px}
.panel h3{font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:var(--brass);font-weight:400;margin-bottom:7px}
#log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:5px;font-size:11px;line-height:1.4;min-height:0}
.le{color:var(--bone-dim);border-left:2px solid #2C2438;padding-left:7px}
.le b{color:var(--bone);font-weight:600}
.le.big{color:var(--gold);border-left-color:var(--gold)}
.le.bad{color:#FF95AC;border-left-color:#B54A63}
.le.talk{font-style:italic;color:#7E7590}
#hint{font-size:10.5px;line-height:1.5;color:var(--bone-dim)}

/* ---------- MODAL ---------- */
#veil{position:fixed;inset:0;background:rgba(4,3,8,.86);backdrop-filter:blur(7px);
  display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
#veil.on{display:flex}
.sheet{
  background:linear-gradient(165deg,#1A1424,#100C18);border:1px solid var(--brass);
  padding:26px 28px;max-width:min(880px,94vw);max-height:92vh;overflow-y:auto;
  box-shadow:0 0 120px -20px rgba(200,164,92,.5);
}
.sheet h2{font-family:'Limelight',serif;font-size:26px;letter-spacing:.14em;color:var(--gold);margin-bottom:4px}
.sheet .eyebrow{font-size:9px;letter-spacing:.34em;text-transform:uppercase;color:var(--d4);margin-bottom:12px}
.sheet p{font-size:13px;line-height:1.65;color:var(--bone-dim);margin-bottom:12px}
.sheet p b{color:var(--bone)}
.rowbtn{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}

/* augment draft cards */
.offers{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px;margin-top:6px}
.aug{
  border:1px solid var(--ac);background:linear-gradient(180deg,var(--abg),#0E0A16);
  padding:18px 16px;text-align:left;transition:.2s;position:relative;overflow:hidden;
}
.aug::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,var(--ac),transparent 70%);opacity:.1;transition:.2s;pointer-events:none}
.aug:hover{transform:translateY(-5px);box-shadow:0 14px 40px -12px var(--ac)}
.aug:hover::after{opacity:.26}
.aug .tier{font-size:8px;letter-spacing:.32em;text-transform:uppercase;color:var(--ac);margin-bottom:8px}
.aug .an{font-family:'Limelight',serif;font-size:17px;letter-spacing:.08em;color:var(--bone);margin-bottom:8px;line-height:1.25}
.aug .ad{font-size:12px;line-height:1.55;color:var(--bone-dim)}
.aug .why{font-size:10.5px;color:var(--ac);margin-top:10px;opacity:.85;letter-spacing:.04em}

/* trade / list rows */
.rows{display:flex;flex-direction:column;gap:5px;margin:10px 0;max-height:44vh;overflow-y:auto}
.row{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid #2C2438;background:#16111F;
  font-size:12px;transition:.15s;text-align:left;width:100%}
.row:hover:not(:disabled){border-color:var(--gold);background:#20182C}
.row:disabled{opacity:.35;cursor:default}
.row .sw{width:9px;height:22px;flex:0 0 auto;background:var(--dc)}
.row .rn{flex:1;letter-spacing:.06em}
.row .rn small{display:block;color:var(--bone-dim);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.row .rv{font-family:'JetBrains Mono',monospace;color:var(--gold)}

input[type=range]{width:100%;accent-color:var(--gold);margin:8px 0}
.appr{font-size:11px;letter-spacing:.2em;text-transform:uppercase;padding:5px 10px;display:inline-block;border:1px solid}
.appr.fair{color:#7CE0A0;border-color:#7CE0A0}
.appr.lop{color:var(--gold);border-color:var(--gold)}
.appr.pred{color:#FF95AC;border-color:#B54A63}

/* rent slam */
#slam{position:fixed;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;z-index:90}
#slam.on{display:flex;animation:shake .5s}
#slam .inner{text-align:center;animation:slam .55s cubic-bezier(.2,1.6,.4,1)}
#slam .who{font-size:11px;letter-spacing:.4em;text-transform:uppercase;color:var(--bone-dim)}
#slam .amt{font-family:'Limelight',serif;font-size:clamp(48px,10vw,110px);color:var(--gold);
  text-shadow:0 0 60px rgba(240,217,140,.75),0 6px 0 #4A3A16;letter-spacing:.04em}
#slam .to{font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:var(--bone)}
@keyframes slam{0%{transform:scale(2.4);opacity:0}55%{transform:scale(.92);opacity:1}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-9px,5px)}40%{transform:translate(8px,-5px)}60%{transform:translate(-5px,-3px)}80%{transform:translate(4px,4px)}}

.chip{display:inline-block;font-size:9px;letter-spacing:.2em;text-transform:uppercase;padding:2px 7px;
  border:1px solid var(--brass-dim);color:var(--brass);margin-right:5px}

@media (max-width:1080px){
  main{grid-template-columns:180px 1fr 210px}
  :root{--cell:64px}
}
@media (max-width:860px){
  main{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}
  #left{display:flex;gap:8px;overflow-x:auto;border-right:none;border-bottom:1px solid #221C2E;padding:8px}
  #left .card{min-width:150px;margin:0}
  #right{border-left:none;border-top:1px solid #221C2E;max-height:150px}
  #hint{display:none}
  :root{--cell:52px}
  .wordmark span{display:none}
  .phasebar{max-width:none}
  .ph b{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.06s!important}
}
#netbar{display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--bone-dim)}
#netbar .dot{width:7px;height:7px;border-radius:50%;background:#5A5265}
#netbar .dot.live{background:#7CE0A0;box-shadow:0 0 9px #7CE0A0}
#netbar .dot.warn{background:#E8C468;box-shadow:0 0 9px #E8C468}
#netbar .dot.err{background:#FF7A9C;box-shadow:0 0 9px #FF7A9C}
#netbar code{font-family:'JetBrains Mono',monospace;color:var(--gold);letter-spacing:.3em;font-size:13px}
.code{font-family:'JetBrains Mono',monospace;font-size:38px;letter-spacing:.34em;color:var(--gold);
  text-align:center;padding:16px;border:1px dashed var(--brass);margin:14px 0;
  text-shadow:0 0 30px rgba(240,217,140,.45)}
.seats{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.seat{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid #2C2438;background:#16111F;font-size:12px}
.seat .sw{width:9px;height:20px}
.seat.empty{opacity:.45;font-style:italic}
.seat b{letter-spacing:.14em;text-transform:uppercase}
input[type=text]{width:100%;background:#0E0A16;border:1px solid var(--brass-dim);color:var(--gold);
  font-family:'JetBrains Mono',monospace;font-size:26px;letter-spacing:.3em;text-align:center;
  padding:12px;text-transform:uppercase;margin:10px 0}
input[type=text]:focus{outline:none;border-color:var(--gold)}
.waiting{color:var(--bone-dim);font-style:italic}

/* ---------- UI polish ---------- */
.sheet{position:relative}
.xclose{
  position:absolute;top:12px;right:12px;width:32px;height:32px;
  border:1px solid var(--brass-dim);color:var(--bone-dim);background:#0E0A16;
  font-size:15px;line-height:1;border-radius:2px;transition:.16s;z-index:5;
}
.xclose:hover{border-color:var(--gold);color:var(--gold);background:#1C1526;transform:rotate(90deg)}
.sheet h2{padding-right:44px}

/* richer rows */
.row{position:relative;overflow:hidden}
.row::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(240,217,140,.07));opacity:0;transition:.18s;pointer-events:none}
.row:hover:not(:disabled)::after{opacity:1}
.row:hover:not(:disabled){transform:translateX(3px)}
.row .rn{font-size:12.5px;letter-spacing:.05em}
.row .rn small{margin-top:2px;opacity:.8}
.row .rv{font-size:13px;font-weight:700}
.rows{gap:6px}

/* action bar emphasis on your turn */
#bar{transition:box-shadow .5s,border-color .5s}
#bar.mine{border-top-color:var(--gold);box-shadow:0 -14px 40px -22px var(--gold),inset 0 1px 0 rgba(240,217,140,.25)}
#prompt{transition:color .3s}
.waiting{color:var(--bone-dim);font-style:italic;letter-spacing:.04em}

/* player card polish */
.card{transition:.35s,transform .18s}
.card:hover{border-color:var(--brass-dim)}
.card .nm{display:flex;align-items:center;gap:5px}

/* price tier cards read as choices, not a list */
.tier-hint{font-size:10.5px;color:var(--bone-dim);margin-top:-4px;margin-bottom:10px;letter-spacing:.05em}

/* modal entrance */
#veil.on .sheet{animation:sheetIn .22s cubic-bezier(.2,.9,.3,1)}
@keyframes sheetIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}

/* scrollbars */
*::-webkit-scrollbar{width:8px;height:8px}
*::-webkit-scrollbar-track{background:#0E0A16}
*::-webkit-scrollbar-thumb{background:#3A3148;border-radius:4px}
*::-webkit-scrollbar-thumb:hover{background:var(--brass-dim)}

/* amount entry */
.amtbox{display:flex;align-items:center;gap:8px;margin:14px 0 8px;flex-wrap:wrap;justify-content:center}
.amtbox input[type=number]{
  flex:1;min-width:150px;background:#0E0A16;border:1px solid var(--brass);color:var(--gold);
  font-family:'JetBrains Mono',monospace;font-size:30px;letter-spacing:.06em;text-align:center;

<script>
"use strict";
const $=s=>document.querySelector(s), el=(t,c)=>{const e=document.createElement(t);if(c)e.className=c;return e};
const money=n=>"$"+Math.round(n).toLocaleString("en-US");
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const esc=s=>String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));

/* ============ CONTENT ============ */
const DISTRICTS=[
  {n:"Copper Row",  c:"var(--d1)", house:50},
  {n:"Tin Quarter", c:"var(--d6)", house:60},
  {n:"Ivory Line",  c:"var(--d2)", house:90},
  {n:"Jade Mile",   c:"var(--d3)", house:120},
  {n:"Garnet Row",  c:"var(--d4)", house:150},
  {n:"Aurum Crest", c:"var(--d5)", house:200},
];
const RAW=[
  {t:"go",   n:"GO"},
  {t:"prop", n:"Foundry Walk", d:0, p:70},
  {t:"prop", n:"Tin Alley",    d:0, p:80},
  {t:"fort", n:"Fortune"},
  {t:"prop", n:"Brass Court",  d:1, p:110},
  {t:"prop", n:"Solder Row",   d:1, p:120},
  {t:"jail", n:"Holding"},
  {t:"prop", n:"Vellum Way",   d:2, p:150},
  {t:"prop", n:"Ivory Lane",   d:2, p:160},
  {t:"fort", n:"Fortune"},
  {t:"prop", n:"Pearl Steps",  d:2, p:180},
  {t:"tax",  n:"Levy", amt:120},
  {t:"vault",n:"The Vault"},
  {t:"prop", n:"Jade Terrace", d:3, p:210},
  {t:"prop", n:"Onyx Bend",    d:3, p:220},
  {t:"fort", n:"Fortune"},
  {t:"prop", n:"Cobalt Rise",  d:3, p:240},
  {t:"prop", n:"Amber Mile",   d:4, p:280},
  {t:"raid", n:"Raid"},
  {t:"prop", n:"Ruby Quarter", d:4, p:300},
  {t:"tax",  n:"Levy", amt:180},
  {t:"prop", n:"Garnet Spire", d:4, p:320},
  {t:"prop", n:"Obsidian Peak",d:5, p:380},
  {t:"prop", n:"Aurum Crown",  d:5, p:430},
];
const AUG={
  silver:[
    {id:"TOLL",  n:"Tollkeeper",  d:"Opponents pay you $40 each time they pass over a tile you own.", w:"Rewards a wide, cheap portfolio."},
    {id:"GRUDGE",n:"Grudge",      d:"Gain a token whenever you pay rent. At 3 tokens, refuse a rent payment.", w:"Turns bad luck into a resource."},
    {id:"BLUE",  n:"Blueprints",  d:"Floors cost 25% less, and the first floor on each property is free.", w:"Develop a set you couldn't afford."},
    {id:"SPOON", n:"Silver Spoon",d:"Gain $500 now. All properties cost you 15% less.", w:"Pure tempo for the land grab."},
    {id:"LUCKY", n:"Lucky Step",  d:"Once per round, reroll the dice.", w:"Insurance against the one roll that ruins you."},
  ],
  gold:[
    {id:"SHARK", n:"Loan Shark",  d:"Take $500 instantly. Repay $650 within 3 rounds or your best property is seized.", w:"Buy a monopoly window before it closes."},
    {id:"DOMAIN",n:"Eminent Domain",d:"Once per game, force-buy any property at 200% of its price. The owner cannot refuse.", w:"Breaks the trade deadlock."},
    {id:"WARDEN",n:"Warden's Pet",d:"Collect +50% rent while jailed, and leave jail on any turn you choose.", w:"Turns the punishment tile into an engine."},
    {id:"VERT",  n:"Vertical Integration",d:"Your rent is calculated as if every property had one more floor.", w:"Scales hardest on a developed set."},
    {id:"DIP",   n:"Double Dip",  d:"Passing GO pays you double.", w:"Quiet, relentless compounding."},
  ],
  prismatic:[
    {id:"SOV",   n:"Sovereign",   d:"You no longer need matching colors. While you own 3+ properties, all of them pay doubled rent.", w:"Deletes the trading game. Everyone will hate you."},
    {id:"OVER",  n:"Overtime",    d:"Take a second turn every turn. All rent you pay is doubled until your next turn.", w:"Winning in four rounds or broke in two."},
    {id:"WRECK", n:"Wrecking Ball",d:"Landing on a developed opponent property: pay nothing and destroy a floor instead.", w:"Doesn't make you rich. Makes you a problem."},
    {id:"MINT",  n:"The Mint",    d:"Whenever any player passes GO, you collect $200 as well.", w:"You get paid for other people's turns."},
    {id:"DOPP",  n:"Doppelgänger",d:"Copy the strongest augment held by the player in first place.", w:"Let the leader do your thinking."},
  ]
};
const AUGBY={};["silver","gold","prismatic"].forEach(t=>AUG[t].forEach(a=>{a.tier=t;AUGBY[a.id]=a}));
const PHASES=[
  {n:"Dawn", s:"Land grab",  r:[1,3],  m:1,   sky:0},
  {n:"Noon", s:"Development",r:[4,7],  m:1.5, sky:1},
  {n:"Dusk", s:"War",        r:[8,12], m:2,   sky:2},
  {n:"Night",s:"Last call",  r:[13,18],m:3,   sky:3},
];
const DRAFTS={2:"silver",5:"gold",9:"prismatic"};
const HOUSE_MULT=[1,4,10,22,40];
const FLOORS=[5,9,14,20,27];
const FORTUNE=[
  {t:"Dividend from the Aurum Trust.", f:p=>gain(p,220)},
  {t:"Speakeasy raided. You are held.", f:p=>jail(p)},
  {t:"The board approves your motion.", f:p=>gain(p,160)},
  {t:"Façade restoration ordered.", f:p=>spend(p,floorsOwned(p)*45+60)},
  {t:"A marquee premiere in your name.", f:p=>G.players.forEach(o=>{if(o!==p&&!o.out)transfer(o,p,60)})},
  {t:"A private car to the Aurum Crown.", f:p=>walkTo(p,23)},
  {t:"Return to GO. Collect what you're due.", f:p=>walkTo(p,0)},
  {t:"Ledger error, in your favor.", f:p=>gain(p,140)},
  {t:"Dockworkers walk out.", f:p=>spend(p,190)},
  {t:"Your driver takes a wrong turn.", f:p=>walkTo(p,(p.pos+21)%24,true)},
  {t:"Vault dividend on your holdings.", f:p=>gain(p,p.props.length>=4?320:90)},
  {t:"An anonymous benefactor.", f:p=>gain(p,260)},
];
const BANTER={
  buy:["Mine now.","I've had my eye on that.","Bargain.","Sign here."],
  rent:["Pleasure doing business.","That's the price of walking here.","Thank you kindly.","Compounding beautifully."],
  pay:["Highway robbery.","I'll remember this.","Enjoy it while it lasts.","Fine. Fine!"],
  aug:["Oh, this changes things.","Now we're playing.","I know exactly what to do with this."],
  jail:["Temporary setback.","I'll be out shortly.","Best seat in the house, actually."],
};
const BOTNAMES=["Vance","Odile","Kestrel"];

/* ============ NET (PeerJS / WebRTC) ============ */
const NET={ mode:"local", code:null, seat:0, uid:null, peer:null, conns:[], hostConn:null,
  ver:0, seenVer:-1, status:"", ready:false };
const CODE_ALPHA="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const newCode=()=>Array.from({length:5},()=>CODE_ALPHA[rnd(CODE_ALPHA.length)]).join("");
const ROOM=code=>"mogul-"+code;               // PeerJS id namespace

function peerReady(){ return typeof window!=="undefined" && typeof window.Peer==="function"; }

function netStatus(){
  const b=$("#netbar"); if(!b)return;
  if(NET.mode==="local"){ b.innerHTML=""; return; }
  const live = NET.mode==="host" ? "hosting" : (NET.ready?"connected":"connecting");
  const cls  = NET.ready||NET.mode==="host" ? "live" : "warn";
  b.innerHTML=`<span class="dot ${cls}"></span><span>${live}</span><code>${NET.code}</code>`;
}

/* --- snapshot the whole board so a guest can draw it --- */
function snapshot(){
  return { t:"state", v:++NET.ver, over:G.over, started:!!G.startedGame,
    round:G.round, phase:G.phase, turn:G.turn, dice:G.dice,
    players:G.players.map(p=>({i:p.i,name:p.name,bot:p.bot,human:p.human,claim:p.claim,cash:p.cash,pos:p.pos,
      props:p.props,augs:p.augs,jail:p.jail,out:p.out,recv:p.recv,grudge:p.grudge,
      loan:p.loan,domainUsed:p.domainUsed,otPenalty:p.otPenalty})),
    tiles:G.tiles.map(t=>({o:t.owner,h:t.houses,f:t.free})),
    logs:G.logs.slice(0,45), pending:G.pending, sellerPending:sellerPending };
}
function applySnapshot(s){
  if(!G||G.players.length!==s.players.length){ newGame(s.players.map(p=>p.name)); buildBoard(); }
  const wasStarted=G.startedGame;
  G.over=s.over; G.round=s.round; G.phase=s.phase; G.turn=s.turn; G.dice=s.dice;
  G.startedGame=s.started;
  s.players.forEach((sp,i)=>Object.assign(G.players[i],sp));
  s.tiles.forEach((st,i)=>{G.tiles[i].owner=st.o;G.tiles[i].houses=st.h;G.tiles[i].free=st.f});
  G.logs=s.logs||[]; G.pending=s.pending;
  sellerPending=s.sellerPending||null;
  const mine=G.players.findIndex(p=>p.claim===NET.uid);
  if(mine>=0)NET.seat=mine;
  if(!s.started){ renderLobby(s); redrawLog(); render(); return; }   // still in lobby
  if(!wasStarted){ closeModal(); }                                   // match just began -> leave the waiting room
  redrawLog(); render();
  // a seller prompt aimed at me takes priority over the ordinary pending view
  if(sellerPending&&isMine(sellerPending.seat))renderSellerPrompt();
  else renderPending();
  if(s.over)showResults();
}
/* host pushes state to every guest */
function publish(){ if(NET.mode!=="host")return;
  const snap=snapshot();
  NET.conns.forEach(c=>{ try{ if(c&&typeof c.send==="function"&&c.open!==false)c.send(snap) }catch(e){} });
}
/* --- HOST --- */
function startHost(){
  NET.mode="host"; NET.uid="host"; NET.seat=0; NET.code=newCode();
  NET.peer=new window.Peer(ROOM(NET.code));
  NET.peer.on("open",()=>{ NET.ready=true; netStatus(); renderLobbyHost(); });
  NET.peer.on("error",err=>{
    if(String(err).includes("unavailable-id")){ // code collision, try another
      NET.peer.destroy(); NET.code=newCode(); NET.peer=new window.Peer(ROOM(NET.code));
      NET.peer.on("open",()=>{NET.ready=true;netStatus();renderLobbyHost()});
      NET.peer.on("connection",onGuest); return;
    }
    netFail(String(err));
  });
  NET.peer.on("connection",onGuest);
  newGame(["You",...BOTNAMES]);
  G.players.forEach((p,i)=>{p.bot=i>0;p.human=i===0;p.claim=i===0?"host":null});
  NET.startedGame=false; buildBoard(); render(); fit();
}
function onGuest(conn){
  const add=()=>{ if(!NET.conns.includes(conn))NET.conns.push(conn); };
  conn.on("open",add);
  add();                         // register now; some WebRTC impls fire "open" before we attach
  conn.on("data",d=>hostRecv(conn,d));
  conn.on("close",()=>{ NET.conns=NET.conns.filter(c=>c!==conn);
    const seat=G.players.findIndex(p=>p.claim===conn.uid);
    if(seat>=0&&!G.startedGame){ G.players[seat].human=false; G.players[seat].claim=null; renderLobbyHost(); }
  });
}
function hostRecv(conn,d){
  if(d.t==="join"){
    conn.uid=d.uid;
    let seat=G.players.findIndex(p=>p.claim===d.uid);
    if(seat<0)seat=G.players.findIndex(p=>!p.human&&!p.claim);
    if(seat>=0){
      G.players[seat].claim=d.uid; G.players[seat].human=true; G.players[seat].bot=false;
      G.players[seat].name=(d.name||"Player").slice(0,12);
      log(`<b>${esc(G.players[seat].name)}</b> takes a seat.`,"big");
    }
    conn.send({t:"seat",seat});
    if(!G.startedGame)renderLobbyHost();
    else { render(); publish(); }
  }
  if(d.t==="choice"){
    if(G.pending&&G.pending.seat===d.seat)applyChoice(d.choice);
  }
  if(d.t==="sellerChoice"){
    if(sellerPending&&sellerPending.seat===d.seat&&sellerCb)sellerCb(d.choice);
  }
}
/* --- GUEST --- */
function startGuest(code,name){
  NET.mode="guest"; NET.code=code; NET.uid="u"+Date.now().toString(36)+rnd(9999); NET.seat=-1; NET.name=name;
  NET.peer=new window.Peer();
  NET.peer.on("open",()=>{
    const c=NET.peer.connect(ROOM(code),{reliable:true});
    NET.hostConn=c;
    let opened=false;
    c.on("open",()=>{ opened=true; NET.ready=true; netStatus(); c.send({t:"join",uid:NET.uid,name:NET.name}); waitingRoom(); });
    c.on("data",guestRecv);
    c.on("close",()=>{ if(!G||!G.over)info("Disconnected",`<div class="eyebrow">Lost the table</div><h2>Connection closed</h2><p>The host's table is no longer reachable.</p>`); });
    setTimeout(()=>{ if(!opened)netNotFound(code); },6000);
  });
  NET.peer.on("error",err=>{
    if(String(err).includes("peer-unavailable"))return netNotFound(code);
    netFail(String(err));
  });
}
function guestRecv(d){
  if(d.t==="seat"){ NET.seat=d.seat; return; }
  if(d.t==="state"){ if(d.v<=NET.seenVer)return; NET.seenVer=d.v; applySnapshot(d); }
}
function netFail(msg){
  NET.mode="local";
  info("Connection error",`<div class="eyebrow">WebRTC</div><h2>Couldn't open a table</h2><p>${esc(msg)}</p><p>This can happen on restrictive networks. Same-screen solo play still works.</p>`);
  $("#mx").onclick=()=>{closeModal();menu()};
}
function netNotFound(code){
  NET.mode="local"; if(NET.peer)NET.peer.destroy();
  info("Not found",`<div class="eyebrow">No table</div><h2>Nothing at ${esc(code)}</h2><p>Check the code with the host — five characters. The host must have their table open first, in this same page.</p>`);
  $("#mx").onclick=()=>{closeModal();menu()};
}
function netTeardown(){
  try{ NET.conns.forEach(c=>c.close&&c.close()); NET.hostConn&&NET.hostConn.close&&NET.hostConn.close();
       NET.peer&&NET.peer.destroy&&NET.peer.destroy(); }catch(e){}
  Object.assign(NET,{mode:"local",code:null,seat:0,uid:null,peer:null,conns:[],hostConn:null,ver:0,seenVer:-1,ready:false,startedGame:false});
  netStatus();
}

/* ============ STATE ============ */
let G=null, busy=false, pendingCb=null, modalSig=null, modalKind="system";

function newGame(names){
  G={
    round:1, phase:0, turn:0, over:false, dice:[0,0], logs:[], pending:null, banner:null,
    players:names.map((n,i)=>({
      i, name:n, bot:false, human:false, color:`var(--p${i})`,
      cash:1500+[0,60,140,250][i], pos:0, props:[], augs:[], jail:0, out:false, recv:false,
      grudge:0, luckyUsed:false, domainUsed:false, loan:null, otUsed:false, otPenalty:false,
    })),
    tiles:RAW.map((r,i)=>({
      i, type:r.t, name:r.n, dist:r.d, price:r.p||0, amt:r.amt||0,
      rent:r.p?Math.round(r.p*0.11):0, owner:null, houses:0, free:false,
    })),
  };
}
const P=()=>G.players[G.turn];
const alive=()=>G.players.filter(p=>!p.out);
const has=(p,id)=>p.augs.includes(id);
const phase=()=>PHASES[G.phase];
const mult=()=>phase().m;
const houseCost=(p,t)=>Math.round(DISTRICTS[t.dist].house*(has(p,"BLUE")?0.75:1));
const buyCost=(p,t)=>Math.round(t.price*(has(p,"SPOON")?0.85:1));
const netWorth=p=>p.cash+p.props.reduce((s,i)=>{const t=G.tiles[i];return s+t.price+t.houses*DISTRICTS[t.dist].house*0.7},0);
const floorsOwned=p=>p.props.reduce((s,i)=>s+G.tiles[i].houses,0);
const isMine=seat=>seat===NET.seat;
function monopoly(p,d){
  const set=G.tiles.filter(t=>t.type==="prop"&&t.dist===d);
  return set.length>0&&set.every(t=>t.owner===p.i);
}

/* ============ MONEY ============ */
function gain(p,n){p.cash+=n;pop(p)}
function spend(p,n){p.cash-=n;pop(p);settle(p)}
function transfer(a,b,n){a.cash-=n;b.cash+=n;pop(a);pop(b);settle(a)}
function pop(p){const c=document.getElementById("card"+p.i);if(c){c.classList.remove("flash");void c.offsetWidth;c.classList.add("flash")}}
let pendingRecv=null;
function settle(p){
  if(p.cash>=0||p.out)return;
  if(!p.recv){
    p.recv=true; log(`<b>${esc(p.name)}</b> enters receivership.`,"bad");
    if(p.bot)grantAug(p,botDraft(p,rollOffers(p,"gold")),true); else pendingRecv=p;
  }
  while(p.cash<0&&p.props.length){
    const idx=p.props.slice().sort((a,b)=>G.tiles[b].price-G.tiles[a].price)[0];
    const t=G.tiles[idx];
    const val=Math.round((t.price+t.houses*DISTRICTS[t.dist].house*0.7)*0.6);
    p.cash+=val; t.owner=null; t.houses=0; t.free=false;
    p.props=p.props.filter(x=>x!==idx);
    log(`<b>${esc(t.name)}</b> auctioned out of receivership for ${money(val)}.`,"bad");
  }
  if(p.cash<0&&!p.props.length)p.cash=0;
}
function calcRent(t,payer){
  if(t.owner===null)return 0;
  const o=G.players[t.owner];
  const h=t.houses+(has(o,"VERT")?1:0);
  let r=t.rent*HOUSE_MULT[Math.min(h,4)];
  if(t.houses===0){
    if(monopoly(o,t.dist))r*=2;
    else if(has(o,"SOV")&&o.props.length>=3)r*=2;
  }else if(has(o,"SOV")&&o.props.length>=3&&!monopoly(o,t.dist))r*=1.5;
  if(has(o,"WARDEN")&&o.jail>0)r*=1.5;
  r*=mult();
  if(payer&&payer.otPenalty)r*=2;
  return Math.round(r/5)*5;
}

/* ============ BOARD ============ */
const COORD=[];
(function(){
  for(let c=6;c>=0;c--)COORD.push([c,6]);
  for(let r=5;r>=0;r--)COORD.push([0,r]);
  for(let c=1;c<=6;c++)COORD.push([c,0]);
  for(let r=1;r<=5;r++)COORD.push([6,r]);
})();
const cellPx=()=>parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--cell"));

function buildBoard(){
  const plane=$("#plane"); plane.innerHTML="";
  const cell=cellPx();
  G.tiles.forEach((t,i)=>{
    const [c,r]=COORD[i];
    const d=el("div","tile");
    d.id="t"+i; d.style.left=(c*cell)+"px"; d.style.top=(r*cell)+"px"; d.dataset.i=i;
    plane.appendChild(d);
  });
  const core=el("div"); core.id="core";
  core.innerHTML=`<div class="inner">
    <div id="phname">Dawn</div><div id="phsub">Land grab</div>
    <div id="dice"><div class="die" id="d1">–</div><div class="die" id="d2">–</div></div>
    <div id="mult">RENT ×1</div></div>`;
  plane.appendChild(core);
  G.players.forEach(p=>{
    const tk=el("div","tok"+(p.i===NET.seat?" me":"")); tk.id="tok"+p.i;
    tk.style.setProperty("--pc",p.color); tk.innerHTML="<i></i><u></u>";
    plane.appendChild(tk);
  });
  if(!plane.dataset.wired){
    plane.dataset.wired="1";
    plane.addEventListener("click",e=>{const d=e.target.closest(".tile");if(d)inspect(+d.dataset.i)});
  }
  renderTiles(); moveTokens();
}
function renderTiles(){
  const cell=cellPx();
  G.tiles.forEach((t,i)=>{
    const d=document.getElementById("t"+i); if(!d)return;
    d.className="tile"+(["go","jail","vault","raid"].includes(t.type)?" corner":"")+(t.owner!==null?" owned":"");
    d.innerHTML="";
    if(t.type==="prop"){
      const band=el("div","band"); band.style.setProperty("--dc",DISTRICTS[t.dist].c); d.appendChild(band);
      if(t.owner!==null){
        const g=el("div","ownglow"); g.style.setProperty("--oc",G.players[t.owner].color); d.appendChild(g);
      }
      const l=el("div","lbl");
      l.innerHTML=esc(t.name)
        +(t.houses>0?`<span class="hcount">${"\u25aa".repeat(Math.min(t.houses,3))}${t.houses>=4?" \u2605":""} ${t.houses}</span>`:"")
        +`<span class="price">${t.owner===null?money(t.price):money(calcRent(t,null))}</span>`;
      d.appendChild(l);
      const b=el("div","bldg"+(t.owner===null?" holo":""));
      const base=cell*0.46;
      const addSlice=(w,z,bright)=>{
        const s=el("div","slice");
        s.style.width=w+"px"; s.style.height=w+"px";
        s.style.marginLeft=(-w/2)+"px"; s.style.marginTop=(-w/2)+"px";
        s.style.transform=`translateZ(${z}px)`;
        if(t.owner!==null){
          s.style.setProperty("--sc",DISTRICTS[t.dist].c);
          s.style.filter="brightness("+bright.toFixed(2)+")";
        }
        b.appendChild(s);
      };
      if(t.owner===null){
        // unclaimed: low cyan wireframe footprint
        for(let k=0;k<3;k++)addSlice(base*(1-k*0.12),k*3,1);
      }else{
        // a flat plinth for the lot itself...
        addSlice(base,0,0.5); addSlice(base*0.96,3,0.58);
        // ...then ONE clearly separated block per house, so you can count them
        let z=9;
        for(let h=0;h<t.houses;h++){
          const w=base*(0.82-h*0.09);
          addSlice(w,z,0.62+h*0.09);
          addSlice(w*0.97,z+3,0.70+h*0.09);
          addSlice(w*0.90,z+6,0.86+h*0.09);   // bright cap marks the top of each house
          z+=12;                               // visible gap between houses
        }
        if(t.houses>=4){
          const cr=el("div","crown");
          cr.style.width="6px";cr.style.height="6px";cr.style.marginLeft="-3px";cr.style.marginTop="-3px";
          cr.style.transform=`translateZ(${z+6}px)`;
          b.appendChild(cr);
        }
      }
      d.appendChild(b);
    }else{
      const sub={go:"Collect $200",jail:"Just visiting",vault:"+$150",raid:"Go to holding",fort:"Draw",tax:money(t.amt)}[t.type]||"";
      const l=el("div","lbl"); l.innerHTML=esc(t.name)+`<span class="price">${sub}</span>`;
      d.appendChild(l);
    }
  });
}
function moveTokens(){
  const cell=cellPx();
  G.players.forEach(p=>{
    const tk=document.getElementById("tok"+p.i); if(!tk)return;
    const [c,r]=COORD[p.pos];
    const ox=(p.i%2)*15-7.5, oy=Math.floor(p.i/2)*15-7.5;
    tk.style.left=(c*cell+cell/2-8+ox)+"px";
    tk.style.top=(r*cell+cell/2-8+oy)+"px";
    tk.style.opacity=p.out?0.2:1;
  });
}

/* ============ DECISIONS ============
   Every choice a person makes goes through ask(). The host holds the callback;
   whoever owns the seat sees the buttons. Everyone else sees who we're waiting on. */
function ask(seat,kind,text,opts,data,cb){
  G.pending={seat,kind,text,opts,data};
  pendingCb=cb;
  if(NET.mode==="host")publish();
  renderPending();
}
function renderPending(){
  const q=G.pending;
  // A live seller prompt for me overrides everything else.
  if(sellerPending&&isMine(sellerPending.seat)){ return renderSellerPrompt(); }
  if(!q){ closeModal(); setBar(busy?"\u2026":"",[]); return; }
  const mine=isMine(q.seat);
  if(!mine){
    closeModal();
    setBar(`<span class="waiting">Waiting on <b>${esc(G.players[q.seat].name)}</b>\u2026</span>`,[]);
    return;
  }
  if(q.kind==="bar"){
    closeModal();
    setBar(q.text,q.opts.map((o,k)=>({t:o.t,cls:o.cls,dis:o.dis,f:()=>choose(k)})));
    return;
  }
  if(q.kind==="draft"){
    const sig="draft:"+q.data.offers.join(",");
    if(modalSig===sig&&$("#veil").classList.contains("on"))return;
    modalSig=sig;
    const tier=q.data.tier;
    const col={silver:"#8C97A8",gold:"var(--brass)",prismatic:"#A45CD6"}[tier];
    const bg={silver:"#191E26",gold:"#221A0F",prismatic:"#1E1030"}[tier];
    modal(`<div class="eyebrow">${q.text}</div><h2>${tier} Draft</h2>
      <p>Everyone at the table is choosing right now. <b>Your build is public</b> — they will see what you take, and plan around it.</p>
      <div class="offers">${q.data.offers.map((id,k)=>{const a=AUGBY[id];return `
        <button class="aug" data-k="${k}" style="--ac:${col};--abg:${bg}">
          <div class="tier">${tier}</div><div class="an">${esc(a.n)}</div>
          <div class="ad">${esc(a.d)}</div><div class="why">${esc(a.w)}</div>
        </button>`}).join("")}</div>`,true,"decision");
    $("#sheet").querySelectorAll(".aug").forEach(b=>b.onclick=()=>choose(+b.dataset.k));
    return;
  }
  if(q.kind==="amount"){
    const sig="amount:"+q.text+":"+q.data.def;
    if(modalSig===sig&&$("#veil").classList.contains("on"))return;
    modalSig=sig;
    const d=q.data;
    modal(`<div class="eyebrow">${d.eyebrow||""}</div><h2>${q.text}</h2>
      <p>${d.intro||""}</p>
      <div class="amtbox">
        <button class="btn ghost amtstep" data-v="-100">−100</button>
        <button class="btn ghost amtstep" data-v="-10">−10</button>
        <input type="number" id="amtin" value="${d.def}" min="${d.min}" max="${d.max}" step="1">
        <button class="btn ghost amtstep" data-v="10">+10</button>
        <button class="btn ghost amtstep" data-v="100">+100</button>
      </div>
      <div class="amtnote" id="amtnote"></div>
      <div class="rowbtn">
        <button class="btn ghost" id="mcancel">${d.cancel||"Back"}</button>
        <button class="btn big" id="amtok">${d.confirm||"Send offer"}</button>
      </div>`,true,"decision");
    const inp=$("#amtin"), note=$("#amtnote");
    const clamp=v=>Math.max(d.min,Math.min(d.max,Math.round(v||0)));
    const upd=()=>{
      const v=clamp(+inp.value);
      inp.value=v;
      if(d.gauge){
        const r=v/d.gauge;
        const c=r<0.9?["pred","Below what they think it is worth"]
              :r<1.5?["lop","A serious offer"]
              :["fair","Well over the odds \u2014 hard to refuse"];
        note.innerHTML=`<span class="appr ${c[0]}">Appraiser: ${c[1]}</span>`;
      }
    };
    inp.oninput=upd; upd();
    $("#sheet").querySelectorAll(".amtstep").forEach(b=>b.onclick=()=>{
      inp.value=clamp((+inp.value)+(+b.dataset.v)); upd();
    });
    $("#amtok").onclick=()=>choose(clamp(+inp.value));
    $("#mcancel").onclick=()=>choose(-1);
    return;
  }
  if(q.kind==="list"){
    const sig="list:"+q.text+":"+(q.data.rows||[]).length;
    if(modalSig===sig&&$("#veil").classList.contains("on"))return;
    modalSig=sig;
    modal(`<div class="eyebrow">${q.data.eyebrow||""}</div><h2>${q.text}</h2>
      <p>${q.data.intro||""}</p>
      <div class="rows">${q.data.rows.map((r,k)=>`
        <button class="row" data-k="${k}" ${r.dis?"disabled":""}>
          ${r.sw?`<span class="sw" style="--dc:${r.sw}"></span>`:""}
          <span class="rn">${esc(r.n)}<small>${esc(r.s||"")}</small></span>
          <span class="rv">${r.v||""}</span></button>`).join("")||"<p>Nothing available.</p>"}</div>
      <div class="rowbtn"><button class="btn ghost" data-k="-1" id="mcancel">${q.data.cancel||"Done"}</button></div>`,true,"decision");
    $("#sheet").querySelectorAll(".row").forEach(b=>b.onclick=()=>choose(+b.dataset.k));
    $("#mcancel").onclick=()=>choose(-1);
    return;
  }
}
function choose(k){
  if(NET.mode==="guest"){
    closeModal();                    // never leave the guest staring at a dead window
    sendAction(k);
    setBar('<span class="waiting">Sent\u2026</span>',[]);
    return;
  }
  applyChoice(k);
}
/* Universal escape hatch: ESC or the ✕ always returns you to a usable screen.
   If a prompt is genuinely yours it is redrawn; otherwise the window just closes. */
function escapeUI(){
  closeModal();
  if(!G||!G.startedGame)return menu();          // no match running -> back to the main menu
  if(sellerPending&&isMine(sellerPending.seat))return renderSellerPrompt();
  if(G.pending&&isMine(G.pending.seat)){
    if(G.pending.kind==="bar")return renderPending();
    // a list/draft/amount window: cancelling is the safe, expected action
    return choose(-1);
  }
  if(!G.over)renderPending();
}
function applyChoice(k){
  const cb=pendingCb; if(!cb)return;
  G.pending=null; pendingCb=null; closeModal();
  cb(k);
}
function sendAction(k){
  if(NET.hostConn&&NET.hostConn.open)NET.hostConn.send({t:"choice",seat:NET.seat,choice:k});
}

/* ============ TURN FLOW ============ */
function startTurn(){
  if(G.over)return;
  const p=P();
  if(p.out)return nextTurn();
  p.otPenalty=false; p.luckyUsed=false;
  if(p.loan&&G.round>=p.loan){
    if(p.cash>=650){p.cash-=650;p.loan=null;log(`<b>${esc(p.name)}</b> repays the shark. ${money(650)}.`)}
    else{
      const idx=p.props.slice().sort((a,b)=>G.tiles[b].price-G.tiles[a].price)[0];
      if(idx!==undefined){const t=G.tiles[idx];t.owner=null;t.houses=0;p.props=p.props.filter(x=>x!==idx);
        log(`The shark takes <b>${esc(t.name)}</b> from ${esc(p.name)}.`,"bad")}
      p.loan=null;
    }
  }
  render();
  if(p.jail>0&&has(p,"WARDEN")){p.jail=0;log(`<b>${esc(p.name)}</b> strolls out of holding.`)}
  if(p.jail>0){
    if(p.bot)return botJail(p);
    return ask(p.i,"bar",`In holding — <b>${p.jail}</b> turn${p.jail>1?"s":""} left. Roll doubles, or post ${money(100)}.`,
      [{t:"Roll for doubles"},{t:"Post bail $100",cls:"ghost",dis:p.cash<100}],null,k=>{
        if(k===1){spend(p,100);p.jail=0;log(`<b>${esc(p.name)}</b> posts bail.`);render();rollDice()}
        else rollDice(true);
      });
  }
  if(p.bot){ setBar(`${esc(p.name)} is thinking…`,[]); return setTimeout(()=>botTrade(p,()=>rollDice()),700) }
  askTurn(p);
}
function askTurn(p){
  const opts=[{t:"Roll",cls:"big"}], acts=["roll"];
  if(has(p,"SHARK")&&!p.loan){opts.push({t:"Take $500 loan",cls:"ghost"});acts.push("loan")}
  ask(p.i,"bar",`Your move. Rent is running at <b>\u00d7${mult()}</b>. Trading and building come after you roll.`,opts,null,k=>{
    const a=acts[k];
    if(a==="roll")return rollDice();
    if(a==="loan"){gain(p,500);p.loan=G.round+3;log(`<b>${esc(p.name)}</b> takes ${money(500)} from the shark. ${money(650)} due by round ${p.loan}.`,"bad");render();return askTurn(p)}
    askTurn(p);
  });
}
function rollDice(forDoubles){
  const p=P(); busy=true;
  $("#d1").classList.add("rolling"); $("#d2").classList.add("rolling");
  setBar(`${esc(p.name)} rolls…`,[]);
  setTimeout(()=>{
    const a=1+rnd(6), b=1+rnd(6);
    G.dice=[a,b];
    $("#d1").classList.remove("rolling"); $("#d2").classList.remove("rolling");
    $("#d1").textContent=a; $("#d2").textContent=b;
    busy=false;
    if(forDoubles){
      if(a===b){p.jail=0;log(`<b>${esc(p.name)}</b> rolls doubles and walks.`);render();return afterRoll(a+b)}
      p.jail--; log(`<b>${esc(p.name)}</b> stays in holding.`); render();
      return setTimeout(nextTurn,600);
    }
    if(has(p,"LUCKY")&&!p.luckyUsed){
      if(p.bot){
        const t=G.tiles[(p.pos+a+b)%24];
        if(t.type==="prop"&&t.owner!==null&&t.owner!==p.i&&calcRent(t,p)>200){
          p.luckyUsed=true;log(`<b>${esc(p.name)}</b> burns Lucky Step.`);return setTimeout(()=>rollDice(),450);
        }
      }else{
        render();
        return ask(p.i,"bar",`You rolled <b>${a+b}</b>.`,
          [{t:"Move "+(a+b),cls:"big"},{t:"Lucky Step — reroll",cls:"ghost"}],null,k=>{
            if(k===1){p.luckyUsed=true;log(`<b>${esc(p.name)}</b> burns Lucky Step.`);return rollDice()}
            afterRoll(a+b);
          });
      }
    }
    afterRoll(a+b);
  },520);
}
function afterRoll(steps){
  const p=P(); busy=true; let n=0;
  setBar(`${esc(p.name)} moves ${steps}…`,[]);
  const step=()=>{
    p.pos=(p.pos+1)%24; n++;
    if(p.pos===0)passGo(p); else if(n<steps)tollCheck(p,G.tiles[p.pos]);
    moveTokens();
    if(n<steps)setTimeout(step,105);
    else{busy=false;land(p)}
  };
  setTimeout(step,105);
}
function passGo(p){
  if(G.round>=13){log(`<b>${esc(p.name)}</b> passes GO. Last call — nothing paid.`);return}
  const amt=200*(has(p,"DIP")?2:1);
  gain(p,amt); log(`<b>${esc(p.name)}</b> passes GO. ${money(amt)}.`);
  G.players.forEach(o=>{if(o!==p&&!o.out&&has(o,"MINT")){gain(o,200);log(`The Mint pays <b>${esc(o.name)}</b> ${money(200)}.`)}});
}
function tollCheck(p,t){
  if(t.owner===null||t.owner===p.i)return;
  const o=G.players[t.owner];
  if(has(o,"TOLL")){transfer(p,o,40);log(`Toll: <b>${esc(p.name)}</b> → ${esc(o.name)} ${money(40)}.`)}
}
function walkTo(p,i,back){
  const fwd=(i-p.pos+24)%24;
  if(!back&&fwd>0&&p.pos+fwd>=24)passGo(p);
  p.pos=i; moveTokens(); setTimeout(()=>land(p),320);
}
function jail(p){
  p.pos=6;p.jail=3;moveTokens();
  log(`<b>${esc(p.name)}</b> is sent to holding.`,"bad");talk(p,"jail");render();
  setTimeout(nextTurn,700);
}
function land(p){
  const t=G.tiles[p.pos]; render();
  switch(t.type){
    case "go": log(`<b>${esc(p.name)}</b> lands squarely on GO.`); return endStep();
    case "jail": log(`<b>${esc(p.name)}</b> is just visiting Holding.`); return endStep();
    case "vault": gain(p,150); log(`<b>${esc(p.name)}</b> draws ${money(150)} from The Vault.`); return endStep();
    case "raid": log(`<b>${esc(p.name)}</b> lands on <b>Raid</b> and is taken to Holding.`,"bad"); return jail(p);
    case "tax": spend(p,t.amt); log(`<b>${esc(p.name)}</b> pays a levy of ${money(t.amt)}.`,"bad"); return endStep();
    case "fort": {
      const c=pick(FORTUNE);
      log(`<b>${esc(p.name)}</b> — Fortune: “${c.t}”`);
      const before=p.pos; c.f(p); render();
      if(p.pos===before&&p.jail===0)endStep();
      return;
    }
    case "prop": return propLand(p,t);
  }
}
function propLand(p,t){
  if(t.owner===null){
    const cost=buyCost(p,t);
    if(p.bot)return botBuy(p,t,cost);
    return ask(p.i,"bar",`<b>${esc(t.name)}</b> — ${DISTRICTS[t.dist].n}. ${money(cost)} to buy.`,
      [{t:"Buy "+money(cost),cls:"big",dis:p.cash<cost},{t:"Decline → auction",cls:"ghost"}],null,k=>{
        if(k===0){buy(p,t,cost);endStep()}else auction(t);
      });
  }
  if(t.owner===p.i){log(`<b>${esc(p.name)}</b> is home.`);return endStep()}
  const o=G.players[t.owner], r=calcRent(t,p);
  if(has(p,"WRECK")&&t.houses>0){
    if(p.bot)return wreck(p,t);
    return ask(p.i,"bar",`<b>${esc(t.name)}</b> — ${esc(o.name)} wants ${money(r)}.`,
      [{t:"Pay "+money(r)},{t:"Wrecking Ball",cls:"danger"}],null,k=>{
        if(k===1)return wreck(p,t);
        payRent(p,o,t,r); endStep();
      });
  }
  if(has(p,"GRUDGE")&&p.grudge>=3){
    p.grudge-=3; log(`<b>${esc(p.name)}</b> spends a Grudge and pays nothing.`,"big"); talk(p,"pay"); return endStep();
  }
  payRent(p,o,t,r); endStep();
}
function payRent(p,o,t,r){
  transfer(p,o,r);
  if(has(p,"GRUDGE")){p.grudge++;log(`<b>${esc(p.name)}</b> banks a grudge (${p.grudge}/3).`)}
  log(`<b>${esc(p.name)}</b> pays <b>${esc(o.name)}</b> ${money(r)} at ${esc(t.name)}.`,r>=400?"big":"");
  if(r>=350)slam(p.name+" pays",r,"→ "+o.name);
  talk(o,"rent"); talk(p,"pay"); render();
}
function wreck(p,t){
  t.houses--; log(`<b>${esc(p.name)}</b> takes a floor off <b>${esc(t.name)}</b>. No rent paid.`,"big");
  slam("Wrecking Ball",null,t.name); render(); endStep();
}
function buy(p,t,cost){
  p.cash-=cost; t.owner=p.i; p.props.push(t.i); pop(p);
  log(`<b>${esc(p.name)}</b> takes <b>${esc(t.name)}</b> for ${money(cost)}.`);
  talk(p,"buy"); render();
}
function auction(t){
  // Live ascending auction. Everyone still solvent may bid, including the player who declined.
  // Bots decide a ceiling from botValue; humans get a bar prompt to raise or pass.
  const bidders=G.players.filter(p=>!p.out);
  let price=Math.max(10,Math.round(t.price*0.4/10)*10);
  let high=null;                       // current high bidder
  let idx=0, passes=0;
  const order=bidders.slice();
  log(`Auction for <b>${esc(t.name)}</b> opens at ${money(price)}.`);
  render();
  const step=()=>{
    if(passes>=order.length){        // everyone passed since last raise
      return close();
    }
    const p=order[idx%order.length];
    idx++;
    if(p===high||p.out||p.cash<price+2){ passes++; return next(); }
    if(p.bot){
      const ceiling=Math.round(botValue(p,t)*(0.7+Math.random()*0.5));
      const up=(ceiling-price)>150?50:10;
      if(price+up<=ceiling&&price+up<=p.cash){
        price+=up; high=p; passes=0; log(`<b>${esc(p.name)}</b> bids ${money(price)}.`); render();
      }else passes++;
      return next();
    }
    // human bidder: choose your own increment
    const steps=[2,10,100];
    ask(p.i,"bar",
      `Auction — <b>${esc(t.name)}</b>. Current bid <b>${money(price)}</b>${high?` by ${esc(high.name)}`:""}. You hold ${money(p.cash)}.`,
      steps.map(v=>({t:"+"+money(v),cls:v===10?"big":"",dis:p.cash<price+v}))
           .concat([{t:"Pass",cls:"ghost"}]),null,k=>{
        const v=steps[k];
        if(v!==undefined&&p.cash>=price+v){
          price+=v; high=p; passes=0;
          log(`<b>${esc(p.name)}</b> bids ${money(price)}.`); render();
        }else passes++;
        next();
      });
  };
  const next=()=>setTimeout(step, high&&high.bot?260:120);
  const close=()=>{
    if(high){ high.cash-=price; t.owner=high.i; high.props.push(t.i); pop(high);
      log(`<b>${esc(high.name)}</b> wins <b>${esc(t.name)}</b> for ${money(price)}.`,"big");
      if(price>=250)slam("Auction won",price,"→ "+high.name);
    }else log(`<b>${esc(t.name)}</b> draws no bids.`);
    render(); endStep();
  };
  step();
}
function endStep(){
  const p=P();
  if(pendingRecv&&pendingRecv===p&&!p.bot){
    const who=pendingRecv; pendingRecv=null;
    return draftFor(who,"gold",()=>endStep());
  }
  pendingRecv=null;
  if(p.bot)return setTimeout(()=>botBuild(p),500);
  turnHub(p);
}
/* Single stable return point for the human's post-roll turn. Every sub-action
   (build/trade/domain/auction) returns here by calling turnHub(p) — no threaded
   callbacks, which is what was stranding the player with no buttons. */
function turnHub(p){
  busy=false;
  const opts=[],acts=[];
  const canBuild=G.round<13&&p.props.some(i=>monopoly(p,G.tiles[i].dist)&&G.tiles[i].houses<4);
  opts.push({t:"Build",cls:canBuild?"":"ghost",dis:!canBuild}); acts.push("build");
  const canTrade=G.tiles.some(t=>t.type==="prop"&&t.owner!==null&&t.owner!==p.i);
  opts.push({t:"Trade",cls:"ghost",dis:!canTrade}); acts.push("trade");
  if(has(p,"DOMAIN")&&!p.domainUsed&&canTrade){opts.push({t:"Eminent domain",cls:"ghost"});acts.push("domain")}
  opts.push({t:"End turn",cls:"big"}); acts.push("end");
  ask(p.i,"bar",canBuild?"You hold a complete district. Build while you can."
    :(G.round>=13?"Last call — construction is closed.":"Nothing forced. Trade, build, or pass."),opts,null,k=>{
      const a=acts[k];
      if(a==="build")return openBuild(p);
      if(a==="trade")return openTradeList(p);
      if(a==="domain")return openDomain(p);
      nextTurn();
    });
}
function openBuild(p){
  const list=p.props.map(i=>G.tiles[i]).filter(t=>monopoly(p,t.dist)&&t.houses<4);
  const rows=list.map(t=>{
    const c=(has(p,"BLUE")&&!t.free)?0:houseCost(p,t);
    return {i:t.i,sw:DISTRICTS[t.dist].c,n:t.name,
      s:`${t.houses} floors \u2192 ${t.houses+1} \u00b7 rent ${money(calcRent(t,p))} \u2192 ${money(Math.round(t.rent*HOUSE_MULT[t.houses+1]*mult()))}`,
      v:c===0?"FREE":money(c), dis:p.cash<c};
  });
  ask(p.i,"list","Build",null,{eyebrow:"Construction",
    intro:"Only in districts you hold complete. Each floor multiplies rent: \u00d71 \u2192 \u00d74 \u2192 \u00d710 \u2192 \u00d722 \u2192 \u00d740.",
    rows,cancel:"Done"},k=>{
      if(k<0)return turnHub(p);
      const t=G.tiles[rows[k].i];
      const c=(has(p,"BLUE")&&!t.free)?0:houseCost(p,t);
      if(has(p,"BLUE")&&!t.free)t.free=true;
      p.cash-=c; t.houses++; pop(p);
      log(`<b>${esc(p.name)}</b> raises <b>${esc(t.name)}</b> to ${t.houses} floor${t.houses>1?"s":""}${c?" for "+money(c):" \u2014 free"}.`);
      render(); openBuild(p);
    });
}
function openDomain(p){
  const list=G.tiles.filter(t=>t.type==="prop"&&t.owner!==null&&t.owner!==p.i);
  const rows=list.map(t=>({i:t.i,sw:DISTRICTS[t.dist].c,n:t.name,
    s:`${G.players[t.owner].name} \u00b7 ${DISTRICTS[t.dist].n}`,v:money(t.price*2),dis:p.cash<t.price*2}));
  ask(p.i,"list","Eminent Domain",null,{eyebrow:"Gold augment \u00b7 once per game",
    intro:"Force-buy any lot at 200% of its printed price. The holder has no say.",
    rows,cancel:"Cancel"},k=>{
      if(k<0)return turnHub(p);
      const t=G.tiles[rows[k].i], o=G.players[t.owner], c=t.price*2;
      p.cash-=c;o.cash+=c;o.props=o.props.filter(x=>x!==t.i);p.props.push(t.i);t.owner=p.i;t.houses=0;t.free=false;
      p.domainUsed=true;
      log(`<b>${esc(p.name)}</b> seizes <b>${esc(t.name)}</b> from ${esc(o.name)} for ${money(c)}.`,"big");
      slam("Eminent Domain",c,t.name); render(); turnHub(p);
    });
}
function openTradeList(p){
  const list=G.tiles.filter(t=>t.type==="prop"&&t.owner!==null&&t.owner!==p.i);
  if(!list.length){
    return ask(p.i,"bar","Nobody else holds a lot yet \u2014 there is nothing to trade for.",
      [{t:"Back",cls:"big"}],null,()=>turnHub(p));
  }
  // sort: lots that complete one of my districts first, then by district
  const completes=t=>{
    const set=G.tiles.filter(x=>x.type==="prop"&&x.dist===t.dist);
    return set.filter(x=>x.owner===p.i).length===set.length-1;
  };
  list.sort((a,b)=>(completes(b)?1:0)-(completes(a)?1:0)||a.dist-b.dist);
  const rows=list.map(t=>({i:t.i,sw:DISTRICTS[t.dist].c,
    n:t.name+(completes(t)?"  \u25c6 completes your district":""),
    s:`${G.players[t.owner].name} \u00b7 ${DISTRICTS[t.dist].n} \u00b7 ${t.houses} floors \u00b7 costs you ${money(calcRent(t,p))} a landing`,
    v:money(t.price)}));
  ask(p.i,"list","Open the deal table",null,{eyebrow:"Cash for a lot",
    intro:"Pick a lot, then choose how hard to push. The holder decides \u2014 and can refuse.",
    rows,cancel:"Close"},k=>{
      if(k<0)return turnHub(p);
      openPrice(p,G.tiles[rows[k].i]);
    });
}
function openPrice(p,t){
  const o=G.players[t.owner];
  const val=botValue(o,t);
  const set=G.tiles.filter(x=>x.type==="prop"&&x.dist===t.dist);
  const completes=set.filter(x=>x.owner===p.i).length===set.length-1;
  const suggested=Math.min(p.cash,Math.round(val*1.7/10)*10);
  ask(p.i,"amount",`Offer on ${t.name}`,null,{
    eyebrow:`Negotiating with ${o.name}`,
    intro:`${DISTRICTS[t.dist].n} \u00b7 printed price ${money(t.price)} \u00b7 you pay ${money(calcRent(t,p))} when you land here.`
      +(completes?" <b>This lot completes your district \u2014 they know it, and will hold out.</b>":"")
      +` Type any amount up to your ${money(p.cash)}.`,
    def:suggested, min:0, max:p.cash, gauge:val,
    cancel:"Back", confirm:"Send offer"
  },k=>{
    if(k<0)return openTradeList(p);
    resolveOffer(p,o,t,Math.max(0,Math.min(p.cash,k)));
  });
}
function resolveOffer(buyer,seller,t,price,botCont){
  const back=()=>{ if(buyer.bot){ if(botCont)botCont(); } else turnHub(buyer); };
  const set=G.tiles.filter(x=>x.type==="prop"&&x.dist===t.dist);
  const completes=set.filter(x=>x.owner===buyer.i).length===set.length-1;
  const need=botValue(seller,t)*(completes?1.9:1.5);
  let done=false;
  const finish=ok=>{
    if(done)return; done=true;                // guard against double-resolution
    if(ok&&buyer.cash>=price&&t.owner===seller.i){
      doTrade(buyer,seller,t,price);
    }else if(ok){
      log(`The deal for <b>${esc(t.name)}</b> fell through.`);
    }else{
      log(`<b>${esc(seller.name)}</b> waves off ${money(price)} for ${esc(t.name)}.`);
    }
    render();
    back();
  };
  if(seller.bot){
    if(!buyer.bot)ask(buyer.i,"bar",`<span class="waiting">${esc(seller.name)} is considering your ${money(price)} offer\u2026</span>`,[],null,()=>{});
    return setTimeout(()=>{
      G.pending=null; pendingCb=null;
      finish(price>=need&&seller.props.length>1);
    },800);
  }
  // human seller (possibly across the network): buyer waits with a Withdraw option
  if(!buyer.bot){
    ask(buyer.i,"bar",`<span class="waiting">Offer of ${money(price)} for ${esc(t.name)} sent to ${esc(seller.name)}\u2026</span>`,
      [{t:"Withdraw offer",cls:"ghost"}],{waitOffer:true},()=>{
        sellerPending=null; sellerCb=null;
        if(done)return;
        done=true;
        log(`<b>${esc(buyer.name)}</b> withdraws the offer.`);
        render(); back();
      });
  }
  askSeller(seller,buyer,t,price,completes,finish);
}
/* A parallel prompt aimed at the seller. On the host it's a second pending slot;
   the host publishes it and the seller (guest) answers it. */
let sellerPending=null, sellerCb=null;
function askSeller(seller,buyer,t,price,completes,finish){
  sellerPending={seat:seller.i,kind:"bar",
    text:`<b>${esc(buyer.name)}</b> offers <b>${money(price)}</b> for ${esc(t.name)}${completes?" — it completes their district":""}.`,
    opts:[{t:"Take "+money(price),cls:"big"},{t:"Refuse",cls:"ghost"}]};
  sellerCb=k=>{ sellerPending=null; sellerCb=null;
    // clear the buyer's waiting prompt if it's still up
    if(G.pending&&G.pending.data&&G.pending.data.waitOffer){G.pending=null;pendingCb=null;}
    finish(k===0);
  };
  if(NET.mode==="host")publish();
  renderSellerPrompt();
}
function renderSellerPrompt(){
  if(!sellerPending)return;
  if(isMine(sellerPending.seat)){
    closeModal();
    setBar(sellerPending.text, sellerPending.opts.map((o,k)=>({t:o.t,cls:o.cls,f:()=>chooseSeller(k)})));
  }
}
function chooseSeller(k){
  if(NET.mode==="guest"){
    // send to host, then immediately clear my own prompt so I never freeze on this screen
    if(NET.hostConn&&NET.hostConn.open)NET.hostConn.send({t:"sellerChoice",seat:NET.seat,choice:k});
    sellerPending=null; sellerCb=null;
    setBar('<span class="waiting">Sent\u2026 waiting for the table.</span>',[]);
    return;
  }
  const cb=sellerCb; sellerPending=null; sellerCb=null;
  if(cb)cb(k);
  if(NET.mode==="host")publish();   // push the resolved state to everyone
}
function doTrade(buyer,seller,t,price){
  buyer.cash-=price; seller.cash+=price;
  seller.props=seller.props.filter(x=>x!==t.i); buyer.props.push(t.i);
  t.owner=buyer.i; t.houses=0; t.free=false;
  log(`<b>${esc(buyer.name)}</b> buys <b>${esc(t.name)}</b> from ${esc(seller.name)} for ${money(price)}.`,"big");
  slam("Deal struck",price,"→ "+seller.name);
  pop(buyer); pop(seller); render();
}
function nextTurn(){
  closeModal();
  const p=P();
  if(has(p,"OVER")&&!p.otUsed&&!p.out&&p.jail===0){
    p.otUsed=true; p.otPenalty=true;
    log(`<b>${esc(p.name)}</b> takes Overtime. Rent paid is doubled until their next turn.`,"big");
    render(); return startTurn();
  }
  p.otUsed=false;
  const live=alive().filter(x=>!(x.recv&&x.props.length===0&&x.cash<=0));
  if(live.length<=1)return finish();
  G.turn=(G.turn+1)%G.players.length;
  if(G.turn===0){
    const d=DRAFTS[G.round], r=G.round;
    G.round++;
    if(G.round>18)return finish();
    G.phase=PHASES.findIndex(ph=>G.round>=ph.r[0]&&G.round<=ph.r[1]);
    if(G.phase<0)G.phase=3;
    render();
    if(d&&!draftDone[r]){draftDone[r]=true;return runDraft(d)}
  }
  render(); startTurn();
}

/* ============ DRAFT ============ */
const draftDone={};
function rollOffers(p,tier){
  let pool=AUG[tier].filter(a=>!p.augs.includes(a.id));
  pool=pool.filter(a=>{
    if((a.id==="VERT"||a.id==="SOV")&&p.props.length<2)return false;
    if(a.id==="DOMAIN"&&!G.players.some(o=>o!==p&&o.props.length))return false;
    if(a.id==="DOPP"&&!G.players.some(o=>o!==p&&!o.out&&o.augs.length))return false;
    return true;
  });
  if(pool.length<3)pool=AUG[tier].filter(a=>!p.augs.includes(a.id));
  const out=[], c=pool.slice();
  while(out.length<3&&c.length)out.push(c.splice(rnd(c.length),1)[0]);
  return out.map(a=>a.id);
}
function grantAug(p,id,quiet){
  if(id==="DOPP"){
    const L=G.players.filter(o=>o!==p&&!o.out).sort((a,b)=>netWorth(b)-netWorth(a))[0];
    const rank={prismatic:3,gold:2,silver:1};
    const best=L?L.augs.filter(x=>!p.augs.includes(x)).sort((a,b)=>rank[AUGBY[b].tier]-rank[AUGBY[a].tier])[0]:null;
    if(best){p.augs.push(best);log(`<b>${esc(p.name)}</b> copies <b>${esc(L.name)}</b>'s <b>${AUGBY[best].n}</b>.`,"big");return}
    id="MINT";
  }
  p.augs.push(id);
  if(id==="SPOON")gain(p,500);
  if(!quiet)log(`<b>${esc(p.name)}</b> drafts <b>${AUGBY[id].n}</b>.`,"big");
  talk(p,"aug");
}
function runDraft(tier){
  G.players.forEach(p=>{ if(p.bot&&!p.out) grantAug(p,botDraft(p,rollOffers(p,tier)),true) });
  render();
  const humans=G.players.filter(p=>!p.bot&&!p.out);
  let n=0;
  const nextHuman=()=>{
    if(n>=humans.length){render();return startTurn()}
    draftFor(humans[n++],tier,nextHuman);
  };
  nextHuman();
}
function draftFor(p,tier,done){
  const offers=rollOffers(p,tier);
  if(!offers.length)return done();
  ask(p.i,"draft",`Round ${G.round-1} complete · all players drafting`,null,{tier,offers},k=>{
    grantAug(p,offers[Math.max(0,k)]); render(); done();
  });
}

/* ============ BOTS ============ */
function botValue(p,t){
  let v=t.price*1.15;
  const set=G.tiles.filter(x=>x.type==="prop"&&x.dist===t.dist);
  const mine=set.filter(x=>x.owner===p.i).length;
  if(mine===set.length-1)v*=2.1; else if(mine>0)v*=1.4;
  if(has(p,"SOV"))v*=1.5;
  if(has(p,"TOLL"))v*=1.2;
  v*=1+(G.phase*0.12);
  return Math.round(v);
}
function botDraft(p,offers){
  const nearSet=DISTRICTS.some((d,i)=>{
    const set=G.tiles.filter(t=>t.type==="prop"&&t.dist===i);
    return set.length&&set.filter(t=>t.owner===p.i).length===set.length-1});
  const owns=DISTRICTS.some((d,i)=>monopoly(p,i));
  const W={TOLL:0.50+p.props.length*0.45,GRUDGE:0.85,BLUE:owns?2.0:0.75,
    SPOON:p.cash<600?1.50:0.70,LUCKY:0.85,SHARK:p.cash<700?1.80:0.70,
    DOMAIN:nearSet?1.90:0.60,WARDEN:1.00,VERT:0.60+floorsOwned(p)*0.35+p.props.length*0.25,
    DIP:G.round<8?1.20:0.70,SOV:0.30+p.props.length*0.34,OVER:p.cash>900?1.50:0.70,
    WRECK:p.props.length<3?1.70:0.80,MINT:1.50,DOPP:1.45};
  return offers.slice().sort((a,b)=>((W[b]||1)+Math.random()*1.1)-((W[a]||1)+Math.random()*1.1))[0];
}
function botJail(p){
  if(p.cash>700||p.jail===1){spend(p,100);p.jail=0;log(`<b>${esc(p.name)}</b> posts bail.`);render();setTimeout(()=>rollDice(),450)}
  else{setBar(`${esc(p.name)} rolls for doubles…`,[]);setTimeout(()=>rollDice(true),450)}
}
function botBuy(p,t,cost){
  const v=botValue(p,t);
  const want=p.cash>cost+(G.phase<2?200:450)&&(v>=cost*0.95||p.props.length<2);
  setBar(`${esc(p.name)} considers ${esc(t.name)}…`,[]);
  setTimeout(()=>{ if(want){buy(p,t,cost);endStep()} else {log(`<b>${esc(p.name)}</b> declines ${esc(t.name)}.`);auction(t)} },550);
}
function botBuild(p){
  let built=0;
  if(G.round<13){
    for(let g=0;g<3;g++){
      const opts=p.props.map(i=>G.tiles[i]).filter(t=>monopoly(p,t.dist)&&t.houses<4).sort((a,b)=>a.houses-b.houses);
      if(!opts.length)break;
      const t=opts[0], c=(has(p,"BLUE")&&!t.free)?0:houseCost(p,t);
      if(p.cash-c<(G.phase>=2?250:400))break;
      if(has(p,"BLUE")&&!t.free)t.free=true;
      p.cash-=c;t.houses++;built++;
    }
  }
  if(built)log(`<b>${esc(p.name)}</b> builds ${built} floor${built>1?"s":""}.`);
  render(); setTimeout(nextTurn,built?500:200);
}
function botTrade(p,cb){
  if(G.round<3||G.round>=13||Math.random()<0.4)return cb();
  let want=null;
  DISTRICTS.forEach((d,i)=>{
    const set=G.tiles.filter(t=>t.type==="prop"&&t.dist===i);
    const mine=set.filter(t=>t.owner===p.i).length;
    const gap=set.filter(t=>t.owner!==null&&t.owner!==p.i);
    if(mine===set.length-1&&gap.length===1)want=gap[0];
  });
  if(!want)return cb();
  const o=G.players[want.owner];
  if(o.out)return cb();
  const price=Math.round(botValue(o,want)*(1.7+Math.random()*0.5)/10)*10;
  if(p.cash<price+250)return cb();
  resolveOffer(p,o,want,price,cb);
}

/* ============ END ============ */
function finish(){
  G.over=true; G.pending=null;
  if(NET.mode==="host")publish();
  showResults();
}
function showResults(){
  const rank=G.players.slice().sort((a,b)=>netWorth(b)-netWorth(a));
  const w=rank[0];
  const mine=w.i===NET.seat;
  modal(`<div class="eyebrow">Round ${Math.min(G.round,18)} · ${phase().n}</div>
    <h2>${mine?"You take the city":esc(w.name)+" takes the city"}</h2>
    <p>Final standings by net worth — cash plus holdings.</p>
    <div class="rows">${rank.map((p,k)=>`
      <div class="row" style="border-color:${k===0?"var(--gold)":"#2C2438"}">
        <span class="sw" style="--dc:${p.color}"></span>
        <span class="rn">${k+1}. ${esc(p.name)}${p.recv?" · receivership":""}
          <small>${p.props.length} lots · ${floorsOwned(p)} floors · ${p.augs.map(a=>AUGBY[a].n).join(", ")||"no augments"}</small></span>
        <span class="rv">${money(netWorth(p))}</span></div>`).join("")}</div>
    ${NET.mode==="guest"?"<p class=\"waiting\">The host can start another table.</p>":
      '<div class="rowbtn"><button class="btn big" id="again">Run it back</button></div>'}`,true);
  const a=$("#again"); if(a)a.onclick=()=>{closeModal();netTeardown();menu()};
  setBar("Match complete.",[]);
}

/* ============ ONLINE ============ */
/* ============ MENUS ============ */
function menu(){
  modal(`<div class="eyebrow">Playable prototype</div><h2>MOGUL</h2>
    <p>A 24-lot board, 18 rounds, hard-capped. Three augment drafts — <b>Silver</b> after round 2, <b>Gold</b> after round 5, <b>Prismatic</b> after round 9. Rent scales ×1 → ×1.5 → ×2 → ×3 as the sky turns.</p>
    <div class="rows">
      <button class="row" id="mlocal"><span class="rn">Play solo<small>You against three drafting bots</small></span><span class="rv">→</span></button>
      <button class="row" id="mhost"><span class="rn">Host a table<small>Get a code, share it with friends</small></span><span class="rv">→</span></button>
      <button class="row" id="mjoin"><span class="rn">Join a table<small>Enter a friend's code</small></span><span class="rv">→</span></button>
    </div>
    <div class="rowbtn"><button class="btn ghost" id="mrules">Rules</button></div>`,true);
  $("#mlocal").onclick=startLocal;
  $("#mhost").onclick=()=>peerReady()?hostSetup():noNet();
  $("#mjoin").onclick=()=>peerReady()?joinSetup():noNet();
  $("#mrules").onclick=rules;
}
function noNet(){
  info("Offline",`<div class="eyebrow">Online unavailable</div><h2>Networking didn't load</h2>
    <p>The peer-to-peer library (PeerJS) couldn't load — usually a blocked network or an offline file with no internet. Save this file somewhere it can reach the internet (see the hosting note), or play solo, which needs nothing.</p>`);
  $("#mx").onclick=()=>{closeModal();menu()};
}
function rules(){
  modal(`<div class="eyebrow">How it plays</div><h2>Rules</h2>
  <p><b>Floors multiply rent</b> ×1 → ×4 → ×10 → ×22 → ×40, and you can only build in a district you hold outright. That's why the deal table matters — and why Eminent Domain exists.</p>
  <p><b>Augments are public.</b> Everyone sees everyone's build, so a Sovereign player is a threat you can watch forming and plan against.</p>
  <p><b>Nobody is knocked out early.</b> Going below zero puts you in <b>receivership</b>: lots are auctioned off one at a time, you get a free Gold augment, and you keep playing. Standings resolve on net worth.</p>
  <p><b>Last call</b> begins at round 13. GO pays nothing, construction closes, rent runs at ×3.</p>
  <p>Click any lot on the board to see its full rent ladder.</p>
  <div class="rowbtn"><button class="btn big" id="ok">Back</button></div>`,true);
  $("#ok").onclick=()=>{closeModal();G&&!G.over?renderPending():menu()};
}
function startLocal(){
  netTeardown(); closeModal();
  newGame(["You",...BOTNAMES]);
  G.players.forEach((p,i)=>{p.bot=i>0;p.human=i===0});
  G.startedGame=true;
  NET.seat=0;
  buildBoard(); render(); log("The table is set. Four players, eighteen rounds.");
  fit(); startTurn();
}
function hostSetup(){
  netTeardown(); closeModal();
  startHost();   // opens PeerJS, then renderLobbyHost() fires on "open"
  modal(`<div class="eyebrow">Opening a table…</div><h2>Connecting</h2>
    <p class="waiting">Reserving a room on the peer network…</p>`,true);
}
let LOBBY_FILL_BOTS=true;
function renderLobbyHost(){
  if(G.startedGame)return;
  const humans=G.players.filter(p=>p.human).length;
  const canStart=LOBBY_FILL_BOTS?true:humans>=2;
  modal(`<div class="eyebrow">Your table is open</div><h2>Share this code</h2>
    <div class="code">${NET.code}</div>
    <p>Friends join from their own device with this code. ${humans} of 4 seats taken.</p>
    <div class="seats">${G.players.map(p=>{
      const filled=p.human;
      const label=filled?p.name:(LOBBY_FILL_BOTS?"Open seat → bot":"Open seat → empty");
      const tag=filled?(p.claim==="host"?"host":"ready"):(LOBBY_FILL_BOTS?"bot":"—");
      return `<div class="seat${filled?"":" empty"}">
        <span class="sw" style="background:${p.color}"></span>
        <b>${esc(label)}</b>
        <span style="margin-left:auto;color:var(--bone-dim)">${tag}</span>
      </div>`}).join("")}</div>
    <label style="display:flex;align-items:center;gap:9px;margin:14px 0;font-size:12px;letter-spacing:.06em;cursor:pointer">
      <input type="checkbox" id="fillbots" ${LOBBY_FILL_BOTS?"checked":""} style="width:16px;height:16px;accent-color:var(--gold)">
      Fill empty seats with bots
    </label>
    ${!LOBBY_FILL_BOTS&&humans<2?'<p style="color:#FF95AC">You need at least one friend seated to start without bots.</p>':""}
    <div class="rowbtn">
      <button class="btn ghost" id="cancel">Cancel</button>
      <button class="btn big" id="go" ${canStart?"":"disabled"}>Start the match</button>
    </div>`,true);
  $("#fillbots").onchange=e=>{ LOBBY_FILL_BOTS=e.target.checked; renderLobbyHost(); };
  $("#go").onclick=()=>{
    const humanSeats=G.players.filter(p=>p.human);
    if(!LOBBY_FILL_BOTS){
      // drop empty seats: keep only real players, reindex the table
      if(humanSeats.length<2)return;
      keepOnly(humanSeats);
    }else{
      G.players.forEach(p=>{ if(!p.human)p.bot=true; });
    }
    G.startedGame=true; closeModal();
    log(`The table is set. ${G.players.length} players, eighteen rounds.`);
    buildBoard(); render(); publish(); startTurn();
  };
  $("#cancel").onclick=()=>{netTeardown();menu()};
}
/* rebuild the game with only the given players (drops unclaimed bot seats) */
function keepOnly(keep){
  const names=keep.map(p=>p.name);
  const old=keep.map(p=>({...p}));
  newGame(names);
  keep.forEach((src,i)=>{
    const d=G.players[i];
    d.name=src.name; d.human=src.human; d.bot=false; d.claim=src.claim;
    d.cash=1500+[0,60,140,250][i];
    if(src.claim===NET.uid)NET.seat=i;
  });
  // remap each guest's seat: host tells them via the next snapshot (claim-based)
}
function joinSetup(){
  modal(`<div class="eyebrow">Join a table</div><h2>Enter the code</h2>
    <input type="text" id="jc" maxlength="5" placeholder="ABCDE" autocomplete="off">
    <input type="text" id="jn" maxlength="12" placeholder="your name" autocomplete="off" style="font-size:16px;letter-spacing:.1em;text-transform:none">
    <p>Ask the host for their five-character code. You both need to be online.</p>
    <div class="rowbtn">
      <button class="btn ghost" id="back">Back</button>
      <button class="btn big" id="join">Join</button>
    </div>`,true);
  const inp=$("#jc"); inp.focus();
  inp.onkeydown=e=>{if(e.key==="Enter")$("#join").click()};
  $("#back").onclick=()=>menu();
  $("#join").onclick=()=>{
    const code=(inp.value||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
    const nm=($("#jn").value||"Player").trim()||"Player";
    if(code.length<4)return;
    netTeardown();
    startGuest(code,nm);
    modal(`<div class="eyebrow">Table ${esc(code)}</div><h2>Connecting…</h2>
      <p class="waiting">Finding the host on the peer network…</p>`,true);
  };
}
function waitingRoom(){
  modal(`<div class="eyebrow">Table ${esc(NET.code)}</div><h2>Seated</h2>
    <p class="waiting">Waiting for the host to start the match.</p>`,true);
}
function renderLobby(s){
  modal(`<div class="eyebrow">Table ${esc(NET.code)}</div><h2>Waiting room</h2>
    <div class="seats">${(s.players||[]).map((p,i)=>`
      <div class="seat${p.human?"":" empty"}">
        <span class="sw" style="background:var(--p${i})"></span>
        <b>${esc(p.human?p.name:"Open seat")}</b>
        <span style="margin-left:auto;color:var(--bone-dim)">${p.claim===NET.uid?"you":(p.human?"ready":"bot")}</span>
      </div>`).join("")}</div>
    <p class="waiting">Waiting for the host to start the match.</p>`,true);
}

/* ============ BOOT ============ */
function fit(){
  const wrap=$("#boardwrap"); if(!wrap||!$("#persp"))return;
  const need=cellPx()*7+60;
  const s=Math.min(1,(wrap.clientWidth-20)/need,(wrap.clientHeight-20)/(need*0.80));
  $("#persp").style.transform=`scale(${Math.max(0.42,s)})`;
}
$("#btnhelp").onclick=rules;
document.addEventListener("keydown",e=>{ if(e.key==="Escape")escapeUI(); });
/* Anti-freeze watchdog: if a window is open but the game state says it is not
   your decision, the window is stale — close it and redraw. Runs every 2s. */
setInterval(()=>{
  if(!G||G.over||!G.startedGame)return;          // never touch menus, lobbies or results
  if(modalKind!=="decision")return;              // only a decision window can be stale
  if(!$("#veil").classList.contains("on"))return;
  const mineSeller=sellerPending&&isMine(sellerPending.seat);
  const minePending=G.pending&&isMine(G.pending.seat)&&
    (G.pending.kind==="list"||G.pending.kind==="draft"||G.pending.kind==="amount");
  if(!mineSeller&&!minePending){ closeModal(); renderPending(); }
},2000);
window.addEventListener("resize",()=>{ if(G){buildBoard();render()} fit() });
newGame(["You",...BOTNAMES]); buildBoard(); render(); fit();
menu();
</script>
